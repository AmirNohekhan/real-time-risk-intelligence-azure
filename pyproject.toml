[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "real-time-risk-intelligence-azure"
version = "0.1.0"
description = "Cloud-native real-time risk and anomaly intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "numpy>=1.26,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "pyarrow>=17,<20",
  "structlog>=24.2,<26", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "bandit>=1.7,<2", "types-PyYAML"]
azure = ["azure-eventhub>=5.12,<6", "azure-servicebus>=7.12,<8", "azure-storage-file-datalake>=12.16,<13", "azure-identity>=1.17,<2", "azure-monitor-opentelemetry>=1.6,<2", "azure-ai-ml>=1.20,<2", "mlflow>=2.16,<3"]
explain = ["shap>=0.46,<1"]

[project.scripts]
risk-platform = "risk_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
markers = ["integration: local integration tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["risk_platform"]
ignore_missing_imports = true
