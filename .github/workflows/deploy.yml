name: Deploy Azure
on: {workflow_dispatch: {inputs: {environment: {type: choice, options: [dev, staging, prod], required: true}}}}
permissions: {id-token: write, contents: read}
jobs:
  deploy:
    if: ${{ vars.AZURE_DEPLOYMENT_ENABLED == 'true' }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: {client-id: "${{ secrets.AZURE_CLIENT_ID }}", tenant-id: "${{ secrets.AZURE_TENANT_ID }}", subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infrastructure/terraform init
      - run: terraform -chdir=infrastructure/terraform apply -auto-approve -var environment=${{ inputs.environment }}
